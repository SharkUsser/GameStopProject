<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Intercambio de Videojuegos</title> 
    <link rel="stylesheet" href="styles.css"> 
    <script src="app.js" defer></script> 
</head> 
<body>
    <header>
            <nav>
                <ul>
                    <li><a>Videojuegos</a></li>
                    <li><a>Consolas</a></li>
                    <li><a>Merch</a></li>
                    <li><a>Empresa</a></li>
                    <li><a>Cuenta</a></li>
                </ul>
            </nav>
    </header>


    <div class="contenedor">
        <h1>Intercambio de Videojuegos</h1>

        <label for="nombre">Nombre del Videojuego</label>
        <input
            id="nombre"
            name="nombre"
            type="text"
            required
            minlength="3"
            maxlength="50"
            placeholder="Nombre del videojuego">

        <label for="tipo">Género de Videojuego</label>
        <select id="tipo" name="tipo" required>
            <option value="" selected disabled>Selecciona un Género</option>
            <option value="accion">Acción</option>
            <option value="aventura">Aventura</option>
            <option value="deportes">Deportes</option>
            <option value="carreras">Carreras</option>
            <option value="estrategia">Estrategia</option>
            <option value="rol">RPG (Juego de Rol)</option>
            <option value="terror">Terror</option>
            <option value="simulacion">Simulación</option>
            <option value="plataformas">Plataformas</option>
            <option value="lucha">Lucha</option>
            <option value="otro">Otro</option>
        </select>

        <label for="descripcion">Estado o Descripción</label>
        <textarea id="descripcion"></textarea>

        <label for="correo">Correo electrónico:</label>
        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required>

        <button id="boton" type="button">Proponer Intercambio</button>

        <p id="mensaje" aria-live="polite"></p>
    </div>
    
    <footer>
        All rigths reserved - GameStop USA
    </footer>
</body> 
</html>
